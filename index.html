<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Luma Interactive Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <!-- For Exporting HTML to PNG -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body>

  <div class="studio-layout">
    <aside class="sidebar">
      <div class="sidebar-header">
        <h1>Studio</h1>
        <span class="badge">PRO</span>
      </div>

      <section class="control-group">
        <h2 class="section-header">EVENT DETAILS</h2>
        
        <div class="input-stack">
          <label>Event Name</label>
          <input type="text" id="input-title" value="Rooftop Mixer" placeholder="E.g. Summer Launch Party">
        </div>

        <div class="input-stack">
          <label>Date & Time</label>
          <input type="text" id="input-date" value="Friday, Aug 25 • 9:00 PM" placeholder="Friday, 8PM">
        </div>

        <div class="input-stack">
          <label>Location</label>
          <input type="text" id="input-location" value="Downtown LA" placeholder="123 Main St.">
        </div>

        <div class="input-stack">
          <label>Host / Presenter</label>
          <input type="text" id="input-host" value="Hosted by DesignClub" placeholder="Presented by...">
        </div>
      </section>

      <section class="control-group">
        <h2 class="section-header">ASSET GENERATION</h2>
        
        <div class="input-stack">
          <label>Background Style</label>
          <select id="select-bg-style" class="custom-select">
            <option value="fluid-mesh" selected>Fluid Mesh Gradient</option>
            <option value="solid-dark">Solid Dark</option>
            <option value="blobs">Organic Blobs (Experimental)</option>
          </select>
        </div>

        <div class="input-stack">
          <label>Color Palette</label>
          <select id="select-palette" class="custom-select">
            <option value="sunset" selected>Sunset (Orange/Pink/Purple)</option>
            <option value="ocean">Ocean (Blue/Cyan)</option>
            <option value="neon">Neon (Green/Pink/Yellow)</option>
            <option value="mono">Monochrome (Silver/Grey)</option>
            <option value="redwhite">Red & White</option>
          </select>
        </div>

        <div class="input-stack">
          <label>Include Abstract Shapes</label>
          <label class="toggle-switch">
             <input type="checkbox" id="toggle-shapes" checked>
             <span class="toggle-slider"></span>
          </label>
        </div>

        <div class="input-stack">
          <label>Include Blueprint Grid</label>
          <label class="toggle-switch">
             <input type="checkbox" id="toggle-grid">
             <span class="toggle-slider"></span>
          </label>
        </div>

        <div class="input-stack">
          <label>Hide Text</label>
          <label class="toggle-switch">
             <input type="checkbox" id="toggle-text">
             <span class="toggle-slider"></span>
          </label>
        </div>

        <div class="input-stack">
          <label>Filter Effect</label>
          <select id="select-filter" class="custom-select">
            <option value="none" selected>None</option>
            <option value="noise">Film Grain (Noise)</option>
            <option value="blur">Dreamy Blur</option>
            <option value="vignette">Dark Vignette</option>
          </select>
        </div>
      </section>

      <section class="control-group">
        <h2 class="section-header">LAYOUT & TYPOGRAPHY</h2>
        
        <div class="input-stack">
          <label>Aspect Ratio</label>
          <select id="select-aspect" class="custom-select">
            <option value="4/5" selected>Luma Classic (4:5)</option>
            <option value="1/1">Square (1:1)</option>
            <option value="16/9">Landscape (16:9)</option>
          </select>
        </div>

        <div class="input-stack">
          <label>Typography</label>
          <select id="select-font" class="custom-select">
            <option value="Inter" selected>Inter</option>
            <option value="Playfair Display">Playfair Display</option>
            <option value="Outfit">Outfit</option>
            <option value="Space Grotesk">Space Grotesk</option>
            <option value="Syne">Syne</option>
            <option value="Kanit">Kanit</option>
          </select>
        </div>

        <div class="input-stack">
          <label>Text Color</label>
          <select id="select-text-color" class="custom-select">
            <option value="auto" selected>Auto (Complementary)</option>
            <option value="white">White</option>
            <option value="black">Black</option>
          </select>
        </div>
      </section>

      <div class="action-footer">
        <button id="btn-generate" class="btn-primary">Generate Iterations</button>
      </div>
    </aside>

    <main class="compositor-area">
      <header class="top-nav">
        <h2>Flyer Compositor</h2>
        <p>Viewing 4 generated layout options</p>
      </header>

      <div class="matrix-grid" id="flyer-matrix">
        <!-- Generated flyers inject here -->
      </div>
    </main>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
