<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blob Generator - Pro</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="layout">
  <aside class="sidebar">
    <div class="sidebar-header">
      <h1>BLOB GENERATOR</h1>
    </div>
    
    <details class="control-group" open>
      <summary class="section-header">FILL AND APPEARANCE</summary>
      
      <div class="input-row select-row" style="margin-top: 0.5rem; margin-bottom: 1.5rem;">
          <span class="label">Fill Mode</span>
          <select id="fill-type-select" class="custom-select" style="width: 140px;">
            <option value="solid">Solid</option>
            <option value="linear" selected>Linear Gradient</option>
            <option value="radial">Radial Gradient</option>
          </select>
      </div>

      <div id="solid-controls" style="display: none; margin-bottom: 1.5rem;">
          <div class="color-input">
            <span class="label">Color</span>
            <div class="color-with-hex">
                <input type="color" id="solid-color" value="#ff0080">
                <input type="text" class="hex-input" id="solid-hex" value="#ff0080">
            </div>
          </div>
      </div>

      <div id="gradient-controls" style="margin-bottom: 1.5rem;">
          <div id="stops-container">
            <!-- Dynamic rows injected here -->
          </div>
          <button class="btn-secondary" id="add-stop-btn" style="width: 100%; border-style: dashed; margin-top: 0.5rem; border-color: var(--border);">+ Add Stop</button>
          
          <div class="input-row" style="margin-top: 1.5rem;" id="grad-angle-row">
              <span class="label">Angle</span>
              <input type="range" id="grad-angle" min="0" max="360" value="45">
              <span class="value" id="grad-angle-val">45°</span>
          </div>
          <div class="input-row" style="margin-top: 0.5rem;" id="grad-spread-row">
              <span class="label">Spread</span>
              <input type="range" id="grad-spread" min="10" max="150" value="100">
              <span class="value" id="grad-spread-val">100%</span>
          </div>
      </div>
      <div style="border-top: 1px solid var(--border); margin-top: 1rem; margin-bottom: 1rem;"></div>
      <div class="input-row" style="margin-top: 1rem;">
          <span class="label">Size</span>
          <input type="range" id="size-slider" min="100" max="600" value="300">
          <span class="value" id="size-val">300px</span>
      </div>
      <div class="input-row">
          <span class="label">Points</span>
          <input type="range" id="points-slider" min="3" max="30" value="8">
          <span class="value" id="points-val">8</span>
      </div>
      <div class="input-row">
          <span class="label">Roundness</span>
          <input type="range" id="roundness-slider" min="0" max="100" value="40">
          <span class="value" id="roundness-val">40%</span>
      </div>
      <div class="toggle-row" style="margin-top: 1rem;">
        <span class="label">Show Points</span>
        <label class="toggle-switch">
          <input type="checkbox" id="show-points-toggle">
          <span class="toggle-slider"></span>
        </label>
      </div>
    </details>

    <details class="control-group" open>
      <summary class="section-header">SHAPE CONTROL (RADII)</summary>
      <div id="dynamic-controls">
         <!-- Sliders populated dynamically -->
      </div>
    </details>

    <section class="action-group">
      <button class="btn-primary" id="copy-btn">Copy SVG</button>
      <button class="btn-secondary" id="random-btn">Random Shape</button>
      <button class="btn-reset" id="reset-btn">Reset to Default</button>
    </section>
  </aside>

  <main class="canvas-area">
    <div class="blob-container">
      <svg id="blob-svg" viewBox="-110 -110 220 220" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="blob-grad-linear" x1="14%" y1="14%" x2="85%" y2="85%">
            <stop id="lin-stop-1" offset="0%" stop-color="#ff0080" />
            <stop id="lin-stop-2" offset="100%" stop-color="#7928ca" />
          </linearGradient>
          <radialGradient id="blob-grad-radial" cx="50%" cy="50%" r="50%">
            <stop id="rad-stop-1" offset="0%" stop-color="#ff0080" />
            <stop id="rad-stop-2" offset="100%" stop-color="#7928ca" />
          </radialGradient>
        </defs>
        <path id="blob-path" d="" fill="url(#blob-grad-linear)" />
        <g id="points-group" style="opacity: 0; transition: opacity 0.2s ease;"></g>
      </svg>
    </div>
    <button class="help-btn" data-tooltip="Keyboard Shortcuts:&#xa;C  - Copy SVG&#xa;Space - Random Shape&#xa;R  - Reset">?</button>
  </main>
  
  <aside class="sidebar right-sidebar">
    <div class="sidebar-header">
      <h1>ANIMATE PANEL</h1>
    </div>
    
    <details class="control-group" open>
      <summary class="section-header">PLAYBACK</summary>
      <div class="input-row" style="margin-bottom: 1.5rem;">
        <button class="btn-primary" id="play-btn" style="width: 48%;">Start</button>
        <button class="btn-secondary" id="stop-btn" style="width: 48%;">Stop</button>
      </div>
      
      <div class="input-row" style="margin-bottom: 1rem;">
          <span class="label">Timing</span>
          <input type="range" id="timing-slider" min="100" max="2500" step="50" value="500">
          <span class="value" id="timing-val">500ms</span>
      </div>
      
      <div class="input-row">
          <span class="label">Easing</span>
          <!-- Added full padding right drop down caret base64 in css -->
          <select id="ease-select" class="custom-select">
            <option value="linear">Linear</option>
            <option value="ease">Ease</option>
            <option value="ease-in">Ease In</option>
            <option value="ease-out" selected>Ease Out</option>
            <option value="ease-in-out">Ease In/Out</option>
            <option value="cubic-bezier(0.68, -0.55, 0.265, 1.55)">Bouncy</option>
          </select>
      </div>
    </details>
  </aside>
</div>

<div id="toast" class="toast">SVG Copied!</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
